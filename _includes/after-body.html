</div><!-- /.mk-content -->
</div><!-- /.mk-layout -->
<script>
(function () {
  // Quarto injects before-body inside <main>; lift the fixed sidebar to the
  // body root so it pins to the viewport regardless of ancestor transforms.
  var sb = document.querySelector('.mk-sidebar');
  if (sb && sb.parentNode !== document.body) {
    document.body.insertBefore(sb, document.body.firstChild);
  }

  // The skip link has to stay the first focusable node in the document, so
  // re-hoist it ahead of the sidebar we just moved to body root.
  var skip = document.querySelector('.mk-skip-link');
  if (skip && document.body.firstChild !== skip) {
    document.body.insertBefore(skip, document.body.firstChild);
  }

  // ---- Mobile drawer -----------------------------------------------------
  // Below 760px styles.css releases the fixed rail. Adding .mk-js here upgrades
  // the stacked fallback into an off-canvas drawer; without JS the fallback
  // stands on its own, so the toggle is created here rather than shipped as
  // dead markup in before-body.html. Everything is CSS-gated by the media
  // query, so this is inert on desktop.
  if (sb) {
    sb.id = sb.id || 'mk-sidebar-nav';

    var scrim = document.createElement('div');
    scrim.id = 'mk-nav-scrim';

    var toggle = document.createElement('button');
    toggle.id = 'mk-nav-toggle';
    toggle.type = 'button';
    toggle.setAttribute('aria-controls', sb.id);
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Open navigation');
    toggle.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>';

    document.body.appendChild(scrim);
    document.body.appendChild(toggle);
    document.body.classList.add('mk-js');

    var setNavOpen = function (open) {
      document.body.classList.toggle('mk-nav-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
    };

    toggle.addEventListener('click', function () {
      setNavOpen(!document.body.classList.contains('mk-nav-open'));
    });
    scrim.addEventListener('click', function () { setNavOpen(false); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setNavOpen(false);
    });
    // Any link tap closes the drawer: in-page anchors scroll behind it, and
    // links to other pages are about to unload it anyway.
    sb.addEventListener('click', function (e) {
      if (e.target.closest('a')) setNavOpen(false);
    });
  }

  var nav = document.querySelector('.mk-sidebar__nav');
  if (!nav) return;

  var path = (location.pathname.split('/').pop() || 'index.html');
  var isIndex = (path === '' || path === 'index.html');
  var hashLinks = Array.prototype.slice.call(nav.querySelectorAll('a[href^="#"]'));

  // On pages other than the index, the in-page section links can't resolve,
  // so repoint them at the index and just highlight the current page.
  if (!isIndex) {
    hashLinks.forEach(function (a) {
      a.setAttribute('href', 'index.html' + a.getAttribute('href'));
    });
    nav.querySelectorAll('a').forEach(function (a) {
      if (a.getAttribute('href') === path) a.classList.add('is-active');
    });
    return;
  }

  // Index page: scrollspy that highlights the section currently in view.
  var entries = hashLinks
    .map(function (a) {
      var el = document.getElementById(a.getAttribute('href').slice(1));
      return el ? { link: a, el: el, visible: false } : null;
    })
    .filter(Boolean);
  if (!entries.length) return;

  function setActive(link) {
    hashLinks.forEach(function (a) { a.classList.toggle('is-active', a === link); });
  }

  var current = null;
  var io = new IntersectionObserver(function (obs) {
    obs.forEach(function (o) {
      entries.forEach(function (e) { if (e.el === o.target) e.visible = o.isIntersecting; });
    });
    var visible = entries.filter(function (e) { return e.visible; });
    if (visible.length) {
      visible.sort(function (a, b) {
        return a.el.getBoundingClientRect().top - b.el.getBoundingClientRect().top;
      });
      if (visible[0].link !== current) { current = visible[0].link; setActive(current); }
    }
  }, { rootMargin: '-15% 0px -75% 0px', threshold: 0 });

  entries.forEach(function (e) { io.observe(e.el); });
  setActive(entries[0].link); // default: Home highlighted at the top
})();
</script>
